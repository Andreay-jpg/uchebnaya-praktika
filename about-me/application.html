<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учебная заявка Степанов Андрей</title>
</head>
<body>
    <nav>
        <ul>
          <li><a href="index.html">Обо мне</a></li>
          <li><a href="hobby.html">Мои увлечения</a></li>
          <li><a href="college.html">Мой колледж</a></li>
       </ul>
    </nav>
    <h1>Заявка на учебный кружок</h1>
    <p>Это учебная форма.Вводите вымышленные
         данные. Заявка не сохраняется и не поступает организатору</p>

    <form action="application.html" method="get">
 <p>
    <label for="student">Учебное имя</label>
    <input id="student" name="student" type="text"
            minlength="2" required>
 </p> 
 <p>
    <label for="email">andrey75@gmail.com</label>
    <input id="email" name="email" type="email"
           placeholder="student@example.com" required>
 </p>
 <p>
    <label for="phone">Телефон из 11 цифр</label> 
    <input id="phone" name="phone" type="tel"  
           pattern="[0-9]{11}" required
           aria-describedby="phone-help">
    <small id="phone-help">Без пробелов и знака плюс /small>      
</p>
 <p>
    <label for="date">Желаемая дата занятия</label> 
    <input id="date" name="date" type="date" required>
 </p>   
</form> 
<fieldset>
    <legend>Формат занятия</legend>
    <p><input id="offline" type="radio" name="format" 
              value="offline" required>
      <label for="offline"> В коледже</label></p>
    <p><input id="online" type="radio" name="format" 
            value="online">
     <label for="online">Дистанционно</label></p>
</fieldset>
<p>
  <label for="topic">Направление</label>
  <select id="topic" name="topic"  required>
    <option value="">Выберите направление</option>
    <option value="html">HTML</option>
    <option value="git"></option>
    </select>
</p>
<p>
    <input id="reminder" name="reminder" type="checkbox"
           value="yes">
    <label for="reminder">Добавить учебное напоминание</label>
</p>
<p>
    <label for="comment">Чему я хочу научиться</label> 
    <textarea id="comment" name="comment" rows="4"  
            maxlength="300" required></textarea>
</p>
<button type="submit">Отправитьучебный пример</button>
<button type="reset">Сбросить поля</button>
</body>
</html>
